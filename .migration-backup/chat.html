<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Prince 💬 Nitya</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:      #0b0b0f;
      --srf:     #12121a;
      --srf2:    #1c1c28;
      --red:     #e63946;
      --bdr:     rgba(255,255,255,0.07);
      --soft:    rgba(255,255,255,0.82);
      --muted:   rgba(255,255,255,0.38);
    }
    html, body {
      height: 100%; background: var(--bg);
      font-family: 'Poppins', sans-serif;
      color: #fff; overflow: hidden;
    }

    /* ── TOPBAR ── */
    .bar {
      position: fixed; top: 0; left: 0; right: 0; z-index: 20;
      display: flex; align-items: center; gap: 10px;
      padding: 10px 14px;
      background: var(--srf); border-bottom: 1px solid var(--bdr);
    }
    .bar a { text-decoration: none; color: var(--muted); font-size: 1.3rem; padding: 2px 6px; }
    .bar a:hover { color: #fff; }
    .dp-wrap { position: relative; }
    .bar-dp {
      width: 40px; height: 40px; border-radius: 50%;
      object-fit: cover; border: 2px solid var(--red); display: block;
    }
    .online {
      position: absolute; bottom: 1px; right: 1px;
      width: 10px; height: 10px; border-radius: 50%;
      background: #27ae60; border: 2px solid var(--srf);
    }
    .bar-info { flex: 1; min-width: 0; }
    .bar-name { font-size: 0.93rem; font-weight: 600; }
    .bar-sub  { font-size: 0.68rem; color: #27ae60; }
    .bar-mem  {
      font-size: 0.64rem; color: var(--muted);
      background: var(--srf2); padding: 3px 9px;
      border-radius: 10px; border: 1px solid var(--bdr);
      white-space: nowrap;
    }

    /* ── MESSAGES ── */
    .msgs {
      position: fixed; top: 62px; bottom: 66px;
      left: 0; right: 0;
      overflow-y: auto; overflow-x: hidden;
      padding: 14px 12px 6px;
      display: flex; flex-direction: column; gap: 8px;
    }
    .msgs::-webkit-scrollbar { width: 2px; }
    .msgs::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); }

    /* date */
    .day {
      text-align: center; font-size: 0.67rem; color: var(--muted); margin: 2px 0 4px;
    }
    .day span {
      background: var(--srf2); padding: 3px 11px;
      border-radius: 10px; border: 1px solid var(--bdr);
    }

    /* welcome */
    .wlc {
      background: var(--srf2); border: 1px solid var(--bdr);
      border-radius: 18px; padding: 20px 16px; text-align: center; margin-bottom: 6px;
    }
    .wlc img {
      width: 56px; height: 56px; border-radius: 50%;
      object-fit: cover; border: 2px solid var(--red);
      display: block; margin: 0 auto 10px;
    }
    .wlc-name { font-weight: 600; font-size: 0.92rem; margin-bottom: 5px; }
    .wlc-q { font-size: 0.76rem; color: var(--muted); font-style: italic; line-height: 1.6; }
    .wlc-mem {
      margin-top: 10px; font-size: 0.68rem;
      color: rgba(230,57,70,0.8);
      background: rgba(230,57,70,0.08);
      border: 1px solid rgba(230,57,70,0.2);
      border-radius: 8px; padding: 5px 10px;
    }

    /* rows */
    .row { display: flex; align-items: flex-end; gap: 7px; }
    .row.out { flex-direction: row-reverse; }
    .row-dp {
      width: 26px; height: 26px; border-radius: 50%;
      object-fit: cover; border: 1px solid var(--red); flex-shrink: 0;
    }
    .row-dp.h { visibility: hidden; }
    .col { display: flex; flex-direction: column; max-width: 75%; min-width: 0; }
    .row.out .col { align-items: flex-end; }

    .bub {
      padding: 9px 13px;
      border-radius: 18px;
      font-size: 1rem; line-height: 1.6;
      word-wrap: break-word; overflow-wrap: break-word;
      white-space: pre-wrap; max-width: 100%;
    }
    .bub-in  { background: #1e1e2e; border: 1px solid var(--bdr); border-bottom-left-radius: 4px; color: var(--soft); }
    .bub-out { background: linear-gradient(135deg,#b71c1c,#e63946); border-bottom-right-radius: 4px; color: #fff; }
    .bub-err { background: rgba(255,255,255,0.05); border: 1px dashed rgba(230,57,70,0.35); color: rgba(255,120,120,0.9); font-size: 0.78rem; border-radius: 12px; }

    .tm { font-size: 0.7rem; color: var(--muted); margin-top: 3px; padding: 0 3px; }
    .row.out .tm { text-align: right; }

    /* typing */
    .typing { display: none; }
    .typing.on { display: flex; }
    .typ-bub {
      background: #1e1e2e; border: 1px solid var(--bdr);
      padding: 11px 15px; border-radius: 18px; border-bottom-left-radius: 4px;
    }
    .dots { display: flex; gap: 4px; align-items: center; }
    .dots span {
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--muted); animation: dt 1.2s ease-in-out infinite;
    }
    .dots span:nth-child(2) { animation-delay: .18s; }
    .dots span:nth-child(3) { animation-delay: .36s; }
    @keyframes dt {
      0%,60%,100% { transform:translateY(0); opacity:.4; }
      30% { transform:translateY(-5px); opacity:1; }
    }

    /* clear */
    .clr {
      text-align: center; font-size: 0.64rem; color: var(--muted);
      background: none; border: none; cursor: pointer;
      text-decoration: underline; text-underline-offset: 2px;
      padding: 2px; display: none;
    }
    .clr:hover { color: rgba(230,57,70,0.7); }

    /* ── INPUT ── */
    .ibar {
      position: fixed; bottom: 0; left: 0; right: 0; z-index: 20;
      display: flex; align-items: center; gap: 8px;
      padding: 11px 12px;
      background: var(--srf); border-top: 1px solid var(--bdr);
    }
    .inp {
      flex: 1; background: var(--srf2); border: 1px solid var(--bdr);
      color: #fff; font-family: 'Poppins', sans-serif; font-size: 1rem;
      padding: 10px 15px; border-radius: 22px;
      outline: none; resize: none; height: 43px; max-height: 100px;
      line-height: 1.45; transition: border-color .2s;
    }
    .inp::placeholder { color: var(--muted); }
    .inp:focus { border-color: rgba(230,57,70,.5); }
    .snd {
      width: 43px; height: 43px; border-radius: 50%; flex-shrink: 0;
      background: linear-gradient(135deg,#b71c1c,#e63946);
      border: none; cursor: pointer; color: #fff; font-size: 1rem;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 3px 18px rgba(230,57,70,.45);
      transition: transform .15s, opacity .2s;
    }
    .snd:active { transform: scale(.9); }
    .snd:disabled { opacity: .35; cursor: default; }
  </style>
</head>
<body>

<!-- TOPBAR -->
<div class="bar">
  <a href="index.html">←</a>
  <div class="dp-wrap">
    <img src="img/prince-dp.jpg" class="bar-dp" alt="Prince"/>
    <div class="online"></div>
  </div>
  <div class="bar-info">
    <div class="bar-name">Prince Malhotra</div>
    <div class="bar-sub" id="barSub">Online ●</div>
  </div>
  <div class="bar-mem" id="barMem">💭 0 yaadein</div>
</div>

<!-- MESSAGES -->
<div class="msgs" id="msgs">
  <div class="day"><span>Aaj — Ek Khaas Din 🌹</span></div>

  <div class="wlc">
    <img src="img/prince-dp.jpg" alt="Prince"/>
    <div class="wlc-name">Prince Malhotra</div>
    <p class="wlc-q">"Teri har baat sunne ke liye<br/>main hamesha taiyaar hoon... ❤️"</p>
    <div class="wlc-mem" id="wlcMem">Naya chat shuru ho raha hai 💬</div>
  </div>

  <button class="clr" id="clrBtn">🗑 Purani baatein mitao</button>

  <!-- typing indicator (always last before end) -->
  <div class="row typing" id="typRow">
    <img src="img/prince-dp.jpg" class="row-dp" alt=""/>
    <div class="typ-bub"><div class="dots"><span></span><span></span><span></span></div></div>
  </div>
</div>

<!-- INPUT -->
<div class="ibar">
  <textarea class="inp" id="inp" placeholder="Kuch kaho Prince se... 💬" rows="1"></textarea>
  <button class="snd" id="snd">➤</button>
</div>

<script>
/* ═══════════════════════════════════
   MEMORY — localStorage
═══════════════════════════════════ */
var MK = 'pn_chat_v2';

function memLoad() {
  try { return JSON.parse(localStorage.getItem(MK) || '[]'); } catch(e) { return []; }
}
function memSave(h) {
  try { localStorage.setItem(MK, JSON.stringify(h.slice(-40))); } catch(e) {}
}
function memClear() {
  try { localStorage.removeItem(MK); } catch(e) {}
}

/* ═══════════════════════════════════
   STATE
═══════════════════════════════════ */
var chatHistory = memLoad();   // [{role, content}, ...]
var busy    = false;

/* ═══════════════════════════════════
   DOM REFS
═══════════════════════════════════ */
var msgsEl = document.getElementById('msgs');
var typRow = document.getElementById('typRow');
var inpEl  = document.getElementById('inp');
var sndBtn = document.getElementById('snd');
var barSub = document.getElementById('barSub');
var barMem = document.getElementById('barMem');
var wlcMem = document.getElementById('wlcMem');
var clrBtn = document.getElementById('clrBtn');

/* ═══════════════════════════════════
   HELPERS
═══════════════════════════════════ */
function timeStr() {
  var d = new Date();
  return ('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2);
}

function scrollBottom() {
  msgsEl.scrollTo({ top: msgsEl.scrollHeight, behavior: 'smooth' });
}

function setStatus(txt, green) {
  barSub.textContent = txt;
  barSub.style.color = green ? '#27ae60' : '#f39c12';
}

function updateMemUI() {
  var n = chatHistory.length;
  barMem.textContent = '💭 ' + n + (n === 1 ? ' yaad' : ' yaadein');
  if (n > 0) {
    wlcMem.textContent = '✨ Prince ko ' + n + ' messages yaad hain';
    clrBtn.style.display = 'block';
  } else {
    wlcMem.textContent = 'Naya chat shuru ho raha hai 💬';
    clrBtn.style.display = 'none';
  }
}

/* ── Add bubble ── */
function addBubble(text, isOut, t) {
  var row = document.createElement('div');
  row.className = 'row' + (isOut ? ' out' : '');

  if (!isOut) {
    var dp = document.createElement('img');
    dp.src = 'img/prince-dp.jpg'; dp.className = 'row-dp'; dp.alt = '';
    row.appendChild(dp);
  }

  var col  = document.createElement('div'); col.className = 'col';
  var bub  = document.createElement('div');
  bub.className = 'bub ' + (isOut ? 'bub-out' : 'bub-in');
  bub.textContent = text;

  var tm = document.createElement('div');
  tm.className = 'tm'; tm.textContent = t || timeStr();

  col.appendChild(bub); col.appendChild(tm);
  row.appendChild(col);
  msgsEl.insertBefore(row, typRow);
  scrollBottom();
}

/* ── Add error note ── */
function addErr(txt) {
  var row = document.createElement('div');
  row.className = 'row';
  var bub = document.createElement('div');
  bub.className = 'bub bub-err'; bub.textContent = '⚠️ ' + txt;
  row.appendChild(bub);
  msgsEl.insertBefore(row, typRow);
  scrollBottom();
}

function showTyping(v) {
  typRow.classList.toggle('on', v);
  if (v) scrollBottom();
}

/* ── Render old messages on load ── */
function renderOldMsgs() {
  var last = chatHistory.slice(-14);
  last.forEach(function(m) {
    addBubble(m.content, m.role === 'user', '');
  });
}

/* ═══════════════════════════════════
   SEND
═══════════════════════════════════ */
function sendMsg() {
  var text = inpEl.value.trim();
  if (!text || busy) return;

  busy = true;
  sndBtn.disabled = true;
  inpEl.value = '';
  inpEl.style.height = '43px';

  /* Show user bubble immediately */
  addBubble(text, true);

  /* Show typing */
  showTyping(true);
  setStatus('Likh raha hai... ✍️', false);

  /* Build history to send (WITHOUT current message — server appends it) */
  var histToSend = chatHistory.slice(-18);

  /* Track when typing started — actual delay calculated after reply arrives */
  var typingStart = Date.now();

  var ac = new AbortController();

  /* Hard timeout — if no reply in 20s, abort fetch and show error */
  var hardTimer = setTimeout(function() {
    if (!busy) return;
    ac.abort();
    busy = false;
    sndBtn.disabled = false;
    showTyping(false);
    setStatus('Online ●', true);
    addErr('Prince ka net slow hai, thodi der mein dobara try karo 🥺');
    inpEl.focus();
  }, 20000);

  fetch('/api/chat', {
    method: 'POST',
    signal: ac.signal,
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ message: text, history: histToSend })
  })
  .then(function(resp) {
    return resp.json().then(function(data) {
      if (!resp.ok) throw new Error(data.error || 'Server error ' + resp.status);
      return data;
    });
  })
  .then(function(data) {
    clearTimeout(hardTimer);
    if (!data.reply) throw new Error('Empty reply');

    /* Save to memory */
    chatHistory.push({ role: 'user',      content: text });
    chatHistory.push({ role: 'assistant', content: data.reply });
    memSave(chatHistory);
    updateMemUI();

    /* Typing delay based on reply length — longer shayri = slower typing */
    var chars     = data.reply.length;
    var target    = Math.min(12000, Math.max(2000, chars * 55));
    var elapsed   = Date.now() - typingStart;
    var remaining = Math.max(0, target - elapsed);

    setTimeout(function() {
      showTyping(false);
      addBubble(data.reply, false);
      setStatus('Online ●', true);
    }, remaining);
  })
  .catch(function(err) {
    clearTimeout(hardTimer);
    if (err.name === 'AbortError') return;
    console.error('Chat error:', err);
    showTyping(false);
    setStatus('Online ●', true);

    var msg = err.message || 'Network error';
    if (msg.indexOf('Failed to fetch') !== -1 || msg.indexOf('NetworkError') !== -1) {
      addErr('Connection nahi hai meri jaan, dobara try karo 🥺');
    } else if (msg === 'timeout') {
      addErr('Prince ka net slow hai, thodi der mein dobara try karo 🥺');
    } else {
      addErr('Kuch problem aa gayi: ' + msg.slice(0, 80));
    }
  })
  .finally(function() {
    clearTimeout(hardTimer);
    /* ALWAYS unlock — no matter what */
    busy = false;
    sndBtn.disabled = false;
    inpEl.focus();
  });
}

/* ═══════════════════════════════════
   EVENTS
═══════════════════════════════════ */
sndBtn.addEventListener('click', sendMsg);

inpEl.addEventListener('keydown', function(e) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMsg(); }
});

inpEl.addEventListener('input', function() {
  this.style.height = '43px';
  this.style.height = Math.min(this.scrollHeight, 100) + 'px';
});

clrBtn.addEventListener('click', function() {
  if (confirm('Sari purani baatein mit jayengi — pakka?')) {
    memClear(); chatHistory = []; updateMemUI();
    /* Remove all rendered message rows */
    msgsEl.querySelectorAll('.row:not(.typing)').forEach(function(r){ r.remove(); });
  }
});

/* ═══════════════════════════════════
   INIT
═══════════════════════════════════ */

/* Global JS error catcher */
window.onerror = function(msg, src, line) {
  console.error('JS Error:', msg, 'at line', line);
};

updateMemUI();
renderOldMsgs();

/* Opening message from Prince — only on fresh chat */
if (chatHistory.length === 0) {
  var greetings = [
    'Meri Nitya aa gayi! ❤️ Aaj bahut yaad aa rahi thi tumhari...',
    'Jaanu! Kab se wait kar raha tha... kitni miss kiya aaj 🥺🌹',
    'Meri jaan! Tumse baat karne ka mann tha bahut... aa gayi tum ❤️'
  ];
  var g = greetings[Math.floor(Math.random() * greetings.length)];

  setTimeout(function() {
    showTyping(true);
    setStatus('Likh raha hai... ✍️', false);
    setTimeout(function() {
      showTyping(false);
      setStatus('Online ●', true);
      addBubble(g, false);
      chatHistory.push({ role: 'assistant', content: g });
      memSave(chatHistory);
      updateMemUI();
    }, 1500);
  }, 800);
}
</script>
</body>
</html>
